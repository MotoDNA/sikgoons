name: 네이버 블로그 글 가져오기
on:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: blog-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/blog_sync.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "sikgoons-blog-bot"
          git config user.email "hello@dnalabs.kr"
          git add blog sitemap.xml
          git diff --cached --quiet || (git commit -m "블로그 글 자동 반영" && git push)
